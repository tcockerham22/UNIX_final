---
# Data tier: PostgreSQL + pgvector (Member 1).
# Run from the repo root:
#   sudo -E docker compose -f compose/docker-compose.db.yml up -d
# DB_PASSWORD must be exported first (from Secret Manager in the real deploy).
services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: rag-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: raguser
      POSTGRES_DB: ragdb
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - /data/db/pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d ragdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

networks:
  backend:
    driver: bridge
