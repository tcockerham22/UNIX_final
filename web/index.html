<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ada Orb</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body data-state="idle">
  <main class="holo" aria-label="Ada holographic display">
    <canvas id="orb"></canvas>
    <div class="hud">
      <div id="state-label" class="state">IDLE</div>
      <div id="state-detail" class="detail">awaiting input</div>
      <div class="meta">
        <span id="route-text">route —</span>
        <span class="sep">•</span>
        <span id="model-text">—</span>
        <span class="sep">•</span>
        <span id="link-text" class="offline">offline</span>
      </div>
      <div class="tiers" id="tiers-text">light · moderate · deep</div>
    </div>
    <div id="upload-panel" class="upload-panel collapsed" aria-label="Uploads">
      <button id="upload-toggle" class="upload-toggle" type="button" title="Upload documents">Uploads</button>
      <div id="upload-body" class="upload-body">
        <div class="upload-row">
          <input id="upload-file" class="upload-file" type="file" multiple accept=".pdf,.ppt,.pptx,.doc,.docx,.txt,.md,.csv,.json,.rtf">
          <button id="upload-btn" class="upload-btn" type="button">Upload</button>
        </div>
        <div id="upload-status" class="upload-status">Upload papers, slides, or notes for Ada to learn from.</div>
        <div id="upload-list" class="upload-list"></div>
      </div>
    </div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
