<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ada Orb</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body data-state="idle">
  <main class="app" aria-label="Ada hologram and conversation">
    <section class="orb-stage" aria-label="Ada status orb">
      <canvas id="orb"></canvas>
      <div class="hud">
        <div id="state-label" class="state">IDLE</div>
        <div id="state-detail" class="detail">awaiting input</div>
        <div class="meta">
          <span id="route-text">route —</span>
          <span class="sep">•</span>
          <span id="model-text">—</span>
          <span class="sep">•</span>
          <span id="link-text" class="offline">offline</span>
        </div>
      </div>
    </section>
    <aside class="chat" aria-label="Conversation transcript">
      <div id="messages" class="messages" aria-live="polite"></div>
    </aside>
  </main>
  <script src="/app.js"></script>
</body>
</html>
