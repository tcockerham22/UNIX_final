global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/ada.rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: haproxy
    static_configs:
      - targets: ["haproxy-exporter:9101"]

  - job_name: ada-web
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["ada-web"]
        type: A
        port: 8765
        refresh_interval: 10s
