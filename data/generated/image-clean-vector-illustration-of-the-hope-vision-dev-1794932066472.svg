<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Base Gradient: Matte Forest Green -->
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d4f3e"/>
      <stop offset="50%" stop-color="#1a3829"/>
      <stop offset="100%" stop-color="#0f261c"/>
    </linearGradient>

    <!-- Cone Gradient: Transparent/Translucent -->
    <linearGradient id="coneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>

    <!-- Orb Glow Gradient: Amber -->
    <radialGradient id="orbGlow" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffcc00" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#ffaa00" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8b5a2b" stop-opacity="0"/>
    </radialGradient>

    <!-- Orb Core Gradient -->
    <radialGradient id="orbCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffaa00" stop-opacity="0.9"/>
    </radialGradient>

    <!-- Subtle Noise Texture -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="noise"/>
      <feDiffuseLighting in="noise" lightingColor="#ffffff" surfaceScale="2">
        <feDistantLight azimuth="45" elevation="60"/>
      </feDiffuseLighting>
    </filter>

    <!-- Glow Filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bgGrad)"/>

  <!-- Noise Texture Overlay (Subtle) -->
  <rect width="1024" height="1024" filter="url(#noise)" opacity="0.3"/>

  <!-- Base: Matte Forest Green Cylinder -->
  <path d="M512 896 L512 960 A128 128 0 0 1 384 960 L384 896 Z" fill="url(#baseGrad)"/>
  <ellipse cx="512" cy="896" rx="128" ry="32" fill="#1a3829" opacity="0.9"/>

  <!-- Cone: Transparent/Translucent -->
  <path d="M384 896 L512 768 L640 896 Z" fill="url(#coneGrad)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.1"/>

  <!-- Orb: Glowing Amber Sphere -->
  <circle cx="512" cy="768" r="128" fill="url(#orbGlow)"/>
  <circle cx="512" cy="768" r="96" fill="url(#orbCore)"/>
  
  <!-- Orb Highlights and Reflections -->
  <ellipse cx="400" cy="700" rx="30" ry="15" fill="#ffffff" opacity="0.2" filter="url(#glow)"/>
  <ellipse cx="624" cy="836" rx="30" ry="15" fill="#ffaa00" opacity="0.15" filter="url(#glow)"/>

  <!-- Orb Internal Structure (Subtle Lines) -->
  <path d="M512 768 L480 720 M512 768 L544 720 M512 768 L512 736" stroke="#ffffff" stroke-width="2" stroke-opacity="0.1"/>
  
  <!-- Soft Glow Around Orb -->
  <circle cx="512" cy="768" r="140" fill="none" stroke="#ffaa00" stroke-width="4" opacity="0.1" filter="url(#glow)"/>

  <!-- Decorative Elements: Geometric Accents -->
  <circle cx="320" cy="512" r="20" fill="#ffffff" opacity="0.05"/>
  <circle cx="704" cy="640" r="15" fill="#ffaa00" opacity="0.08"/>
  <rect x="192" y="384" width="10" height="10" rx="2" fill="#ffffff" opacity="0.03"/>
  <rect x="816" y="576" width="10" height="10" rx="2" fill="#ffaa00" opacity="0.04"/>

</svg>